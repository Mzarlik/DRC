# scripts/logrotate_drc_worker.conf
# Configuración de rotación de logs para el demonio Worker del ERP DRC.
# Copiar este archivo a: /etc/logrotate.d/drc-worker

/var/log/drc_worker*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 www-data www-data
    copytruncate
}
